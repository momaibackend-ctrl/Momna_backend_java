name: Java Migration CI

on:
  push:
    branches:
      - main
      - migration/kotlin-to-java-spring
      - qa/postman-e2e-parity
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: momna_test
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d momna_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build and test
        run: ./gradlew clean test bootJar --no-daemon
      - name: Build production container
        run: docker build -t momna-backend-java:ci .
      - name: Postman collection E2E against Java runtime
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:55432/momna_test
          DATABASE_USER: ci_test
          DATABASE_PASSWORD: ci_test_password
          MOMNA_ENV: local
          MOMNA_ROLE: api
          MOMNA_REDIS_ENABLED: 'false'
          MOMNA_OBJECT_STORAGE_ENABLED: 'false'
          PORT: '18080'
        run: |
          set -euo pipefail
          REPORT_DIR="build/reports/newman"
          COLLECTION="postman/momna-core-foundation.postman_collection.json"
          mkdir -p "$REPORT_DIR"
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          test -n "$JAR"
          java -jar "$JAR" > /tmp/momna-java-api.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:$PORT/health/live" >/dev/null; then READY=1; break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Momna Java API exited before becoming healthy"
              cat /tmp/momna-java-api.log
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Momna Java API did not become healthy"
            cat /tmp/momna-java-api.log
            exit 1
          fi
          set +e
          npx --yes newman@6.2.1 run "$COLLECTION" --env-var "baseUrl=http://127.0.0.1:$PORT" --reporters cli,json,junit --reporter-json-export "$REPORT_DIR/newman.json" --reporter-junit-export "$REPORT_DIR/newman.xml"
          NEWMAN_EXIT=$?
          set -e
          test -s "$REPORT_DIR/newman.json"
          test -s "$REPORT_DIR/newman.xml"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('build/reports/newman/newman.json','utf8')).run||{};const e=(r.executions||[]).length,q=Number(r.stats?.requests?.total??e),a=Number(r.stats?.assertions?.total??0),f=(r.failures||[]).length;console.log({executions:e,requests:q,assertions:a,failures:f});if(e<1||q<1||a<1||f>0)process.exit(1)"
          test "$NEWMAN_EXIT" -eq 0
      - name: Publish Newman E2E evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: java-newman-e2e-report
          path: |
            build/reports/newman/newman.json
            build/reports/newman/newman.xml
          if-no-files-found: warn
          retention-days: 14
