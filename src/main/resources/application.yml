server:
  port: ${PORT:8080}

spring:
  application:
    name: momna-backend-java
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

momna:
  environment: ${MOMNA_ENV:local}
  role: ${MOMNA_ROLE:api}
  default-locale: ${MOMNA_DEFAULT_LOCALE:en-US}
  default-timezone: ${MOMNA_DEFAULT_TIMEZONE:UTC}

  object-storage:
    enabled: ${MOMNA_OBJECT_STORAGE_ENABLED:false}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:}
    region: ${OBJECT_STORAGE_REGION:}
    access-key-id: ${OBJECT_STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:}
    diary-bucket: ${OBJECT_STORAGE_DIARY_BUCKET:}
    medical-bucket: ${OBJECT_STORAGE_MEDICAL_BUCKET:}

  redis:
    enabled: ${MOMNA_REDIS_ENABLED:false}
    url: ${REDIS_URL:}
    prefix: ${MOMNA_REDIS_PREFIX:momna}

  # My Day generation (MOMNA-849). Off until a provider is configured; off, My Day answers 503.
  # The API key comes from the environment only and is never logged.
  ai:
    provider:
      base-url: ${MOMNA_AI_BASE_URL:}
      api-key: ${MOMNA_AI_API_KEY:}
      timeout: ${MOMNA_AI_TIMEOUT:15s}
    myday:
      enabled: ${MOMNA_AI_MYDAY_ENABLED:false}
      model: ${MOMNA_AI_MYDAY_MODEL:gpt-4.1-mini}
