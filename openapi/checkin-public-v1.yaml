openapi: 3.0.3
info:
  title: Momna Daily Check-in Public API
  version: 1.0.1
  description: >-
    Public Check-in transport originally established by CI-API-01. CI-B03 does not add
    endpoints; it binds these routes to the server-owned session/window state machine.
  x-session-runtime-owner: CI-B03
  x-session-statuses: [DRAFT, PARTIAL, SUBMITTED, AUTO_FINALIZED]
  x-window-semantics: '[opensAt, closesAt); exact close is CLOSED; no session is created merely because a window closes'
  x-answer-semantics: '0,1,2 are explicit values; unanswered is absence; null in PATCH removes an answer'
  x-finalization-semantics: 'SUBMITTED only by explicit submit; AUTO_FINALIZED only by server window close; consumedAt is orthogonal'
  x-one-generation-per-day: 'MOMNA-989/1025, 23.11.2026: once My Day(D) exists the MORNING phase is closed until the evening. Its summary has allowedEntryAction NONE, entryBlockedReason MY_DAY_PLAN_ALREADY_SET and a localized entryBlockedText; MORNING start and submit return 409 CHECKIN_MORNING_PLAN_ALREADY_SET.'
paths:
  /api/v1/check-in/today:
    get:
      operationId: getCheckinToday
      description: Read both Morning and Evening phase summaries without creating a session. Each summary carries entryBlockedReason and entryBlockedText (null unless MY_DAY_PLAN_ALREADY_SET) and card {title, body} - the Check-in tab invitation while START/RESUME is allowed, the completed card for VIEW_FINAL_STATE, otherwise null. The view carries the localized tab subtitle. Texts follow the implemented design (MOMNA-989 section 8).
      responses:
        '200': { description: Authoritative current local-day phase state, exact windows and existing final/consumed projections }
        '401': { description: Authentication required }
  /api/v1/check-in/sessions:
    post:
      operationId: startOrResumeCheckin
      description: Atomically start or resume the unique canonical session for the current user/window.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase]
              properties:
                phase: { $ref: '#/components/schemas/CheckinPhase' }
      responses:
        '200': { description: Existing current/resumable/final session; final or consumed sessions are never reopened }
        '201': { description: New DRAFT session created while the requested phase window is open }
        '409': { description: Idempotency conflict, window is not startable, or CHECKIN_MORNING_PLAN_ALREADY_SET for MORNING once today's plan exists }
  /api/v1/check-in/sessions/{sessionId}:
    get:
      operationId: getCheckinSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: Authoritative session; first access after deadline may expose server AUTO_FINALIZED state }
        '404': { description: Session not found for current user }
    patch:
      operationId: patchCheckinSession
      description: >-
        Mutate explicit answers while the window is open. A mutable session is DRAFT when no
        answers exist and PARTIAL when at least one exists; PARTIAL may have completionRatio 1.0
        until the user explicitly submits.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, answerChanges]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 0 }
                answerChanges:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemCode, value]
                    properties:
                      itemCode: { type: string }
                      value: { $ref: '#/components/schemas/NullableAnswerValue' }
      responses:
        '200': { description: Updated authoritative session with recomputed completionRatio and server Safety projection }
        '409': { description: Stale revision, idempotency conflict, final/consumed state or non-editable window }
  /api/v1/check-in/sessions/{sessionId}/safety/{routeId}/answers:
    post:
      operationId: answerCheckinSafetyFact
      description: Answer the current question (nextFactCode) of a route this session opened (MOMNA-1145 v2.2). The server decides the next question or the outcome; the frontend never resolves Safety locally.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, factCode, answer]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 0 }
                factCode: { type: string, description: 'The nextFactCode of the route step' }
                answer: { $ref: '#/components/schemas/SafetyAnswer' }
      responses:
        '200': { description: Updated session; safety.routes[] holds each route's next question or outcome. A resolved post-deadline session may become AUTO_FINALIZED }
        '409': { description: Stale revision, idempotency conflict, a route this session did not open (SAFETY_ROUTE_NOT_CURRENT), a fact that is not the current question (SAFETY_FACT_NOT_CURRENT), a completed route (SAFETY_ROUTE_COMPLETED) or a final session }
        '422': { description: SAFETY_VALUE_INVALID }
  /api/v1/check-in/sessions/{sessionId}/safety/{routeId}/revise:
    post:
      operationId: reviseCheckinSafetyFact
      description: Explicitly correct an answered fact. The previous answer is kept in a private audit trail and the route is decided again; it may ask questions again.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, factCode, answer]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 0 }
                factCode: { type: string, description: 'The nextFactCode of the route step' }
                answer: { $ref: '#/components/schemas/SafetyAnswer' }
      responses:
        '200': { description: Updated session; safety.routes[] holds each route's next question or outcome. A resolved post-deadline session may become AUTO_FINALIZED }
        '409': { description: Stale revision, idempotency conflict, a route this session did not open (SAFETY_ROUTE_NOT_CURRENT), a fact that is not the current question (SAFETY_FACT_NOT_CURRENT), a completed route (SAFETY_ROUTE_COMPLETED) or a final session }
        '422': { description: SAFETY_VALUE_INVALID }
  /api/v1/check-in/sessions/{sessionId}/safety/{routeId}/checklist:
    post:
      operationId: answerCheckinSafetyChecklist
      description: Answer a QM screen (questionFactCodes) in one call: SELECTED marks the chosen facts YES and the other shown facts NO; NONE, UNSURE and SKIP set every shown fact to NO, UNSURE or ABSENT.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, mode]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 0 }
                mode: { type: string, enum: [SELECTED, NONE, UNSURE, SKIP] }
                selectedFactCodes: { type: array, items: { type: string }, description: 'Only with SELECTED, at least one, all from questionFactCodes' }
      responses:
        '200': { description: Updated session; safety.routes[] holds each route's next question or outcome. A resolved post-deadline session may become AUTO_FINALIZED }
        '409': { description: Stale revision, idempotency conflict, a route this session did not open (SAFETY_ROUTE_NOT_CURRENT), a fact that is not the current question (SAFETY_FACT_NOT_CURRENT), a completed route (SAFETY_ROUTE_COMPLETED) or a final session }
        '422': { description: SAFETY_VALUE_INVALID }
  /api/v1/check-in/sessions/{sessionId}/safety/{routeId}/blood-pressure:
    post:
      operationId: recordCheckinSafetyBloodPressure
      description: BP1: the measured blood pressure, asked only when the step's nextFactCode is BP_READING.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 0 }
                systolic: { type: integer, minimum: 1, maximum: 300 }
                diastolic: { type: integer, minimum: 1, maximum: 200, description: 'Lower than systolic' }
                unknown: { type: boolean, description: 'true when the reading is not known; then no numbers' }
      responses:
        '200': { description: Updated session; safety.routes[] holds each route's next question or outcome. A resolved post-deadline session may become AUTO_FINALIZED }
        '409': { description: Stale revision, idempotency conflict, a route this session did not open (SAFETY_ROUTE_NOT_CURRENT), a fact that is not the current question (SAFETY_FACT_NOT_CURRENT), a completed route (SAFETY_ROUTE_COMPLETED) or a final session }
        '422': { description: SAFETY_VALUE_INVALID }
  /api/v1/check-in/sessions/{sessionId}/safety/{routeId}/skip:
    post:
      operationId: skipCheckinSafetyRoute
      description: Close the remaining questions of a route as not answered (ABSENT, never NO).
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 0 }
      responses:
        '200': { description: Updated session; safety.routes[] holds each route's next question or outcome. A resolved post-deadline session may become AUTO_FINALIZED }
        '409': { description: Stale revision, idempotency conflict, a route this session did not open (SAFETY_ROUTE_NOT_CURRENT), a fact that is not the current question (SAFETY_FACT_NOT_CURRENT), a completed route (SAFETY_ROUTE_COMPLETED) or a final session }
        '422': { description: SAFETY_VALUE_INVALID }
  /api/v1/check-in/sessions/{sessionId}/submit:
    post:
      operationId: submitCheckin
      description: Explicitly finalize a DRAFT or PARTIAL session while allowed; answering every item is not required.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 0 }
      responses:
        '200': { description: Immutable SUBMITTED final state and typed downstream handoff; completionRatio may be less than 1 }
        '409': { description: Finalized/consumed, stale, idempotency, closed-window, blocking-Safety conflict, or CHECKIN_MORNING_PLAN_ALREADY_SET for a MORNING session once today's plan exists }
components:
  parameters:
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string }
    RouteId:
      in: path
      name: routeId
      required: true
      schema: { type: string, pattern: '^R[0-9]{1,2}
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
  schemas:
    CheckinPhase:
      type: string
      enum: [MORNING, EVENING]
    CheckinSessionStatus:
      type: string
      enum: [DRAFT, PARTIAL, SUBMITTED, AUTO_FINALIZED]
    CheckinAllowedAction:
      type: string
      enum: [EDIT_ANSWERS, SUBMIT, ANSWER_SAFETY, OPEN_MY_DAY]
    SafetyAnswer:
      type: string
      enum: [YES, NO, UNSURE, ABSENT]
    AnswerValue:
      type: integer
      enum: [0, 1, 2]
    NullableAnswerValue:
      nullable: true
      oneOf:
        - $ref: '#/components/schemas/AnswerValue'
, description: 'routeId of a safety.routes[] entry' }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
  schemas:
    CheckinPhase:
      type: string
      enum: [MORNING, EVENING]
    CheckinSessionStatus:
      type: string
      enum: [DRAFT, PARTIAL, SUBMITTED, AUTO_FINALIZED]
    CheckinAllowedAction:
      type: string
      enum: [EDIT_ANSWERS, SUBMIT, ANSWER_SAFETY, OPEN_MY_DAY]
    AnswerValue:
      type: integer
      enum: [0, 1, 2]
    NullableAnswerValue:
      nullable: true
      oneOf:
        - $ref: '#/components/schemas/AnswerValue'
