plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.momna'
version = '0.1.0-migration'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral() }

sourceSets {
    e2e {
        java.srcDir 'src/e2e/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    e2eImplementation.extendsFrom implementation
    e2eRuntimeOnly.extendsFrom runtimeOnly
}
tasks.register('seedE2eDatabase', JavaExec) {
    group = 'verification'
    description = 'Applies Liquibase migrations and seeds disposable network-E2E fixtures.'
    dependsOn tasks.named('e2eClasses')
    classpath = sourceSets.e2e.runtimeClasspath
    mainClass = 'com.momna.e2e.SeedE2eDatabase'
}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'software.amazon.awssdk:s3:2.29.26'
    implementation 'io.lettuce:lettuce-core:6.5.1.RELEASE'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}
tasks.named('test') { useJUnitPlatform() }
