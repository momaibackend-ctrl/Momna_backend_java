server:
  port: ${PORT:8080}

spring:
  application:
    name: momna-backend-java
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: momna
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

momna:
  environment: ${MOMNA_ENV:local}
  role: ${MOMNA_ROLE:api}
  default-locale: ${MOMNA_DEFAULT_LOCALE:en-US}
  default-timezone: ${MOMNA_DEFAULT_TIMEZONE:UTC}
